<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Decks of Doom — Build Your Way Out</title>
<meta name="description" content="A fast 3D construction platformer: build bridges, stairs and ramps while the world collapses behind you." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23201028'/><path d='M4 22h24v4H4zM8 14h16v4H8z' fill='%23f0a04a'/><circle cx='16' cy='8' r='4' fill='%23ffd21f'/></svg>" />
<style>
:root{--ink:#1b1226;--wood:#f0a04a;--gold:#ffd21f;--hot:#ff5a2a;--paper:#fff6e6}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#120a1c;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
#danger{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,40,10,.75) 100%);transition:opacity .15s}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(10,4,20,.5) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;transition:opacity .5s}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.chip{position:absolute;background:rgba(20,10,30,.55);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 14px;font-weight:800}
#stats{top:16px;left:16px;display:flex;gap:16px;align-items:center;font-size:20px}
#wood{font-size:30px;color:var(--wood);min-width:74px;transition:transform .12s}
#wood.pop{transform:scale(1.35)}#wood.no{color:#ff4a3a;transform:scale(1.25) rotate(-4deg)}
#wood small{font-size:12px;opacity:.75;display:block;letter-spacing:.12em;color:#fff}
#lives{color:#ff6a7a;letter-spacing:2px}#stars{color:var(--gold)}
#clock{top:16px;right:16px;font-size:24px;font-variant-numeric:tabular-nums;text-align:right}
#clock small{display:block;font-size:11px;letter-spacing:.14em;opacity:.7}
#track{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:min(44vw,520px);height:16px;border-radius:10px;background:rgba(20,10,30,.6);border:2px solid rgba(255,255,255,.2);overflow:visible}
#track i{position:absolute;top:0;bottom:0;left:0;border-radius:8px}
#tdoom{background:linear-gradient(90deg,#3a0a1a,var(--hot));box-shadow:0 0 14px var(--hot)}
#tme{width:18px!important;height:18px;top:-3px!important;border-radius:50%!important;background:var(--gold);border:3px solid #fff;margin-left:-9px;box-shadow:0 0 10px var(--gold)}
#tend{left:auto!important;right:-6px;width:8px;top:-5px!important;bottom:-5px!important;background:#fff;border-radius:3px!important}
#track b{position:absolute;top:-5px;bottom:-5px;width:3px;background:rgba(255,255,255,.55);border-radius:2px}
#doomtxt{position:absolute;top:44px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:800;letter-spacing:.16em;color:#ffb39a}
#bar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.slot{width:92px;padding:8px 6px 6px;border-radius:14px;background:rgba(20,10,30,.55);border:2px solid rgba(255,255,255,.14);text-align:center;font-weight:800;font-size:13px;transition:transform .1s,border-color .1s,background .1s}
.slot svg{display:block;margin:0 auto 2px;width:48px;height:30px}
.slot kbd{position:absolute;margin:-4px 0 0 -40px;font:700 11px monospace;background:#fff;color:var(--ink);border-radius:5px;padding:1px 5px;text-shadow:none}
.slot em{font-style:normal;color:var(--wood)}
.slot.on{transform:translateY(-8px) scale(1.06);border-color:var(--gold);background:rgba(70,40,20,.75)}
.slot.poor{opacity:.45}
#tip{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.85;font-weight:700;white-space:nowrap}
#banner{position:absolute;top:26%;left:0;right:0;text-align:center;font-size:clamp(28px,6vw,64px);font-weight:900;letter-spacing:.04em;font-style:italic;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;color:#fff;text-shadow:0 4px 0 var(--hot),0 8px 30px rgba(0,0,0,.6)}
#banner.show{opacity:1;transform:scale(1)}
#banner small{display:block;font-size:.34em;font-style:normal;letter-spacing:.2em;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#lock{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:800;background:rgba(0,0,0,.6);padding:8px 16px;border-radius:20px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;background:linear-gradient(180deg,rgba(18,8,30,.35),rgba(18,8,30,.78));overflow:auto}
h1{margin:0;font-size:clamp(44px,9vw,112px);line-height:.9;font-weight:900;font-style:italic;letter-spacing:-.01em;text-align:center;text-shadow:0 5px 0 var(--hot),0 10px 0 #7a1420,0 16px 40px rgba(0,0,0,.6)}
h1 span{color:var(--gold)}
.sub{font-size:clamp(13px,2vw,20px);letter-spacing:.42em;font-weight:800;color:#ffd9b0;text-transform:uppercase;margin-top:-6px}
#cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.card{pointer-events:auto;cursor:pointer;width:250px;text-align:left;padding:16px 18px;border-radius:18px;border:3px solid rgba(255,255,255,.2);background:rgba(25,12,40,.72);backdrop-filter:blur(8px);color:#fff;font:inherit;transition:transform .12s,border-color .12s}
.card:hover:not(.locked){transform:translateY(-6px) rotate(-1deg);border-color:var(--gold)}
.card small{letter-spacing:.14em;font-weight:800;font-size:11px;color:var(--wood);text-transform:uppercase}
.card h3{margin:4px 0 6px;font-size:26px;font-style:italic}
.card p{margin:0 0 10px;font-size:13.5px;opacity:.85;min-height:36px;line-height:1.35}
.card .best{font-weight:800;font-size:13px;color:var(--gold)}
.card.locked{opacity:.45;cursor:not-allowed}
.keys{display:flex;gap:8px 18px;flex-wrap:wrap;justify-content:center;font-size:13px;opacity:.92;max-width:820px}
.keys kbd,.panel kbd{font:700 12px monospace;background:#fff;color:var(--ink);border-radius:5px;padding:2px 6px;margin-right:4px}
.btn{pointer-events:auto;cursor:pointer;font:inherit;font-weight:900;font-size:17px;color:var(--ink);background:var(--gold);border:0;border-radius:14px;padding:12px 24px;box-shadow:0 5px 0 #b8860b;transition:transform .08s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8860b}
.btn.alt{background:#fff;box-shadow:0 5px 0 #b9b0c8}
.link{pointer-events:auto;cursor:pointer;background:none;border:0;color:#fff;font:inherit;font-weight:700;opacity:.8;text-decoration:underline}
.panel{background:rgba(25,12,40,.88);border:3px solid rgba(255,255,255,.2);border-radius:22px;padding:26px 32px;text-align:center;min-width:min(420px,90vw);backdrop-filter:blur(10px)}
.panel h2{margin:0 0 4px;font-size:44px;font-style:italic;text-shadow:0 3px 0 var(--hot)}
.panel table{margin:14px auto;border-collapse:collapse;font-size:16px}.panel td{padding:4px 14px;text-align:left}.panel td:last-child{text-align:right;font-weight:800;color:var(--gold)}
.panel .total td{border-top:2px solid rgba(255,255,255,.25);font-size:22px;padding-top:10px}
.panel .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.medal{font-size:54px;line-height:1}
@media (max-width:700px){#tip{display:none}.slot{width:70px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div><div id="danger"></div><div id="flash"></div>
<div id="hud" class="hidden">
  <div id="stats" class="chip"><div id="wood"><small>WOOD</small><span>0</span></div><div id="lives"></div><div id="stars">★ 0</div></div>
  <div id="track"><i id="tdoom"></i><i id="tend"></i><i id="tme"></i></div>
  <div id="doomtxt"></div>
  <div id="clock" class="chip"><small>TIME</small><span>0:00.0</span></div>
  <div id="banner"></div>
  <div id="lock" class="hidden">Click to capture the mouse · or steer with ← →</div>
  <div id="tip"></div>
  <div id="bar"></div>
</div>
<div id="menu" class="screen">
  <h1>DECKS <span>OF</span> DOOM</h1>
  <div class="sub">Build your way out</div>
  <div id="cards"></div>
  <div class="keys">
    <span><kbd>W A S D</kbd>run</span><span><kbd>Mouse</kbd>look</span><span><kbd>Space</kbd>jump · double jump</span><span><kbd>Shift</kbd>dash</span>
    <span><kbd>Click</kbd>/<kbd>E</kbd>build (hold to pave)</span><span><kbd>1-4</kbd>/<kbd>Q</kbd>/<kbd>Wheel</kbd>piece</span><span><kbd>R</kbd>retry checkpoint</span><span><kbd>Esc</kbd>pause</span>
  </div>
  <button class="link" id="mute">Sound: on</button>
</div>
<div id="modal" class="screen hidden"><div class="panel" id="panel"></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
